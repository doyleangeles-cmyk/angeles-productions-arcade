  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // creepy drone
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.connect(musicGain);
  for (const f of [55, 55.6, 82.4]) { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const g = AC.createGain(); g.gain.value = 0.12; o.connect(g); g.connect(lp); o.start(); }

}
function osc(t, f, dur, type, vol, f2) {
  const o = AC.createOscillator(), g = AC.createGain();

  o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + dur + 0.02);
}

  const s = AC.createBufferSource(); s.buffer = noiseBuf;

}

// ================= SCENE =================
const HR = 58, SC = 1.86, HRD = HR * SC;          // head drawn ~108px radius
const CX = W / 2, CY = 334, GAP = 8, TOP = 50, BOT = 616, HUB = 72;
const TILES = [
  { x0: 12, y0: TOP, x1: CX - GAP, y1: CY - GAP }, { x0: CX + GAP, y0: TOP, x1: W - 12, y1: CY - GAP },
  { x0: 12, y0: CY + GAP, x1: CX - GAP, y1: BOT }, { x0: CX + GAP, y0: CY + GAP, x1: W - 12, y1: BOT },
];
const ZCOL = ['#4ade80', '#f87171', '#60a5fa', '#facc15'];
const ZNAME = ['GREEN', 'RED', 'BLUE', 'YELLOW'];
const SKIN = ['#8fbf6a', '#9fae8c', '#86a3b5', '#b9ab6c'];
const KEYS = [['Digit1', 'Numpad1', 'KeyQ'], ['Digit2', 'Numpad2', 'KeyW'], ['Digit3', 'Numpad3', 'KeyA'], ['Digit4', 'Numpad4', 'KeyS']];
const KEYHINT = ['Q', 'W', 'A', 'S'];

const bg = offscreen(W, H, g => {

  const mg = g.createRadialGradient(780, 110, 10, 780, 110, 160); mg.addColorStop(0, 'rgba(255,245,200,0.5)'); mg.addColorStop(1, 'rgba(255,245,200,0)');
  g.fillStyle = mg; g.fillRect(560, 0, 400, 300);

  g.fillStyle = 'rgba(160,150,110,0.35)'; [[765, 95, 10], [800, 125, 13], [790, 92, 6]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); });

const decal = document.createElement('canvas'); decal.width = W * 2; decal.height = H * 2;
const dg = decal.getContext('2d'); dg.scale(2, 2);
function clearDecals() { dg.clearRect(0, 0, W, H); }

// heads
let seed = 3; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const heads = TILES.map((t, i) => ({
  i, x: (t.x0 + t.x1) / 2, y: (t.y0 + t.y1) / 2 - 10, t, ox: 0, oy: 0, vx: 0, vy: 0, ang: 0, av: 0, phase: 'rest', pt: 0, sx: 0, sy: 0, sang: 0,
  lit: 0, glow: 0, lift: 0, hit: 0, laugh: 0, mouth: 0, blink: rnd(1, 4), lookX: 0, lookY: 0,
  spots: Array.from({ length: 5 }, () => ({ x: (srand() - 0.5) * HR * 1.3, y: (srand() - 0.5) * HR * 1.4, r: HR * (0.06 + srand() * 0.1) })),
  missing: Math.floor(srand() * 5),
  dmg: 0, sk: '#f1c9a5',
  marks: {
    bruises: Array.from({ length: 6 }, (_, k) => ({ x: (srand() - 0.5) * HR * 1.2, y: (srand() - 0.5) * HR * 1.3, r: HR * (0.12 + srand() * 0.12), th: 0.06 + k * 0.12 })),
    cuts: Array.from({ length: 4 }, (_, k) => ({ x: (srand() - 0.5) * HR, y: (srand() - 0.6) * HR, a: srand() * 3, len: HR * (0.2 + srand() * 0.25), th: 0.14 + k * 0.17 })),
    blackEye: srand() < 0.5 ? -1 : 1, popEye: srand() < 0.5 ? -1 : 1,
  },

// how beaten up the heads are: 0 = fresh human at level 1, 1 = full zombie by level 12
const HUMAN = ['#f1c9a5', '#d9a273', '#b9805a', '#8a5a3c'];
const HAIR = ['#2a1a10', '#5a3a1e', '#1e1a14', '#c9a35a'];
const IRIS = ['#3b6ea5', '#5a3a1e', '#2f7a4a', '#6b4a2a'];
function mixHex(a, b, t) {

}
const targetDamage = () => state === 'title' ? 0 : clamp((level - 1) / 11, 0, 1);

// ================= STATE =================
let state = 'title', seq = [], idx = 0, level = 0, lives = 3, score = 0, newBest = false;
let showK = 0, showT = 0, showLit = false, stateT = 0, bannerT = 0, bannerText = '', statusFlash = 0;
let drops = [], chunks = [], poofs = [], screenSplats = [], bursts = [], floaters = [];
let arm = null, shake = 0, redFlash = 0, time = 0, fadeT = 0;

const onTime = () => Math.max(0.2, 0.6 - level * 0.028);
const gapTime = () => Math.max(0.08, onTime() * 0.45);

function startGame() {
  initAudio();
  seq = []; level = 0; lives = 3; score = 0; newBest = false;
  for (const h of heads) { h.dmg = 0; h.sk = HUMAN[h.i]; } // fresh faces for the new game
  drops = []; chunks = []; screenSplats = []; clearDecals();
  commentate('start');
  [0, 1, 3, 2].forEach((k, j) => setTimeout(() => { heads[k].lit = 0.14; SFX.groan(k, 0.14); }, 150 + j * 130));
  nextLevel(1.6);
}
function nextLevel(delay = 0.7) {
  level++;
  seq.push(Math.floor(Math.random() * 4));
  bannerText = 'LEVEL ' + level; bannerT = 1.3;
  const lines = { 3: 'They are starting to bruise.', 6: 'Ooh. That eye is coming loose.', 9: 'They are turning! Keep punching!', 12: 'Full zombie. No mercy.' };
  if ([3, 6, 9, 12].includes(level)) commentate('stage', level);
  else if (level > 1 && level % 5 === 0) commentate('speed', level);
  beginShow(delay);
}
function beginShow(delay) { state = 'show'; showK = 0; showT = -delay; showLit = false; idx = 0; }

function updateShow(dt) {
  showT += dt;
  if (showT < 0) return;
  const on = onTime(), gap = gapTime();
  if (!showLit) {
    const h = heads[seq[showK]]; h.lit = on; SFX.groan(seq[showK], on); showLit = true;
    // your turn starts the moment the last zombie lights up, so a quick first punch is never thrown away
    if (showK === seq.length - 1) { state = 'input'; stateT = 0; idx = 0; if (level <= 2) commentate('turn'); return; }
  }
  if (showT >= on + gap) {
    showK++; showT = 0; showLit = false;
    if (showK >= seq.length) { state = 'input'; stateT = 0; if (level <= 2) commentate('turn'); }
  }
}

function tryPunch(i) {
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (stateT > 1.2) startGame(); return; }
  if (state !== 'input' && state !== 'good') { punchHead(i, true); statusFlash = 0.6; return; } // zombies still showing the pattern: doesn't count
  const extra = state === 'good'; // pattern already finished: any extra punch is a mistake
  punchHead(i, false);
  if (!extra && i === seq[idx]) {
    idx++;
    const pts = 10 * level; score += pts;
    if (idx < seq.length && chance(0.55)) commentate('punch');
    floaters.push({ x: heads[i].x, y: heads[i].y - HRD - 6, t: 0.9, text: '+' + pts, col: ZCOL[i] });
    if (idx === seq.length) {
      state = 'good'; stateT = 0; SFX.win();
      if (level > best) { best = level; newBest = true; try { localStorage.setItem('zsmashBest', best); } catch (e) {} }
      commentate('hit');
    }
  } else {
    lives--; SFX.buzz(); redFlash = 0.6; shake = 14;
    for (const h of heads) h.laugh = 1.3;
    setTimeout(() => SFX.laugh(), 120);
    if (lives <= 0) {
      state = 'over'; stateT = 0; SFX.over();
      for (const hh of heads) hh.lit = 0.6;
      commentate('over', level);
    } else {
      state = 'oops'; stateT = 0;
      commentate(extra ? 'extra' : 'wrong', ZNAME[seq[idx]]);
    }
  }
}

function punchHead(i, light) {
  const h = heads[i];
  const tx = h.x + h.ox, ty = h.y + h.oy - h.lift;
  arm = { i, t: 0, tx, ty };
  h.lit = Math.max(h.lit, 0.16); // the punched panel lights up
  const dir = h.x < CX ? -1 : 1, up = h.y < CY;
  h.phase = 'fly'; h.pt = light ? 0.16 : 0.24;
  h.vx = dir * rnd(300, 620); h.vy = up ? rnd(-1000, -700) : rnd(-650, -350); h.av = dir * rnd(12, 22); h.hit = 0.45;
  for (let k = 0; k < (light ? 18 : 40); k++) {
    const a = rnd(-3.0, -0.1), s = rnd(150, 620);
    drops.push({ x: tx + rnd(-50, 50), y: ty + rnd(-30, 50), vx: Math.cos(a) * s * 1.3, vy: Math.sin(a) * s * 1.2, r: rnd(3, 8), land: rnd(Math.min(ty + 60, BOT - 20), BOT) });
  }
  if (!light && Math.random() < 0.6) for (let k = 0; k < 1 + (Math.random() * 2 | 0); k++)
    chunks.push({ x: tx, y: ty + 20, vx: rnd(-250, 250), vy: rnd(-600, -300), rot: 0, vr: rnd(-15, 15), type: Math.random() < 0.8 ? 'tooth' : 'eye', life: 1.4, land: rnd(Math.min(ty + 80, BOT - 10), BOT) });
  if (!light && Math.random() < 0.4) screenSplat();
  bursts.push({ x: tx, y: ty + 20, t: 0.28, word: pick(['POW!', 'SPLAT!', 'BONK!', 'SMACK!', 'CRUNCH!', 'WHAM!']), col: ZCOL[i], rot: rnd(-0.3, 0.3) });
  shake = Math.max(shake, light ? 4 : 9);

  SFX.groan(i, 0.22);
}
function screenSplat() {
  const x = rnd(120, W - 120), y = rnd(90, 360), r = rnd(30, 70);
  screenSplats.push({ x, y, r, t: 1.3, blobs: Array.from({ length: 7 }, () => ({ a: Math.random() * 6.283, d: r * rnd(0.6, 1.4), r: r * rnd(0.12, 0.35) })), drips: Array.from({ length: 3 }, () => ({ x: rnd(-r * 0.7, r * 0.7), w: rnd(4, 9), sp: rnd(40, 110) })) });
}

// ================= INPUT =================
function columnAt(x, y) { if (Math.hypot(x - CX, y - CY) < 44) return -1; if (y < TOP - 10) return -1; return (y < CY ? 0 : 2) + (x < CX ? 0 : 1); }
function toGame(cx, cy) { const r = cv.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
function pointer(cx, cy) {
  const p = toGame(cx, cy);
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (stateT > 1.2) startGame(); return; }
  const i = columnAt(p.x, p.y);
  if (i >= 0) tryPunch(i);
}
addEventListener('keydown', e => {
  if (window.__apHold && window.__apHold()) return;
  if (camOpen) { if (e.code === 'Escape') closeCam(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.repeat) return;
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'Enter' || e.code === 'Space') { if (state === 'title' || (state === 'over' && stateT > 1.2)) startGame(); return; }

  if (i >= 0) tryPunch(i);

addEventListener('mousedown', e => { if (window.__apHold && window.__apHold()) return; if (isUI(e) || camOpen) return; initAudio(); pointer(e.clientX, e.clientY); });
addEventListener('touchstart', e => {
  if (window.__apHold && window.__apHold()) return;

addEventListener('touchmove', e => { if (!isUI(e)) e.preventDefault(); }, { passive: false });

// ================= UPDATE =================
function updateHead(h, dt) {
  // decay only builds up during a game; it resets only when a new game starts (see startGame)
  const td = targetDamage();
  if (td > h.dmg) h.dmg += (td - h.dmg) * Math.min(1, dt * 3); else if (state === 'title') h.dmg = td;
  h.sk = mixHex(HUMAN[h.i], SKIN[h.i], clamp(h.dmg * 1.25, 0, 1));
  h.lit = Math.max(0, h.lit - dt); h.hit = Math.max(0, h.hit - dt); h.laugh = Math.max(0, h.laugh - dt);
  h.blink -= dt; if (h.blink < -0.13) h.blink = rnd(1.5, 5);
  const k = Math.min(1, dt * 16);
  h.glow = h.lit > 0 ? 1 : Math.max(0, h.glow - dt * 7); // snaps on, fades off fast
  h.lift += ((h.lit > 0 ? 16 : 0) - h.lift) * k;

  const lx = tgt.x - h.x, ly = tgt.y - h.y, ll = Math.hypot(lx, ly) || 1;
  h.lookX += (lx / ll - h.lookX) * k; h.lookY += (ly / ll - h.lookY) * k;
  if (h.phase === 'fly') {
    h.pt -= dt; h.vy += 1900 * dt; h.ox += h.vx * dt; h.oy += h.vy * dt; h.ang += h.av * dt;
    if (Math.random() < dt * 70) drops.push({ x: h.x + rnd(-12, 12), y: h.t.y1 - 40, vx: rnd(-160, 160), vy: rnd(-560, -280), r: rnd(3, 6), land: rnd(h.t.y1 - 30, Math.min(BOT, h.t.y1 + 40)) });
    if (h.pt <= 0) { h.phase = 'ret'; h.pt = 0.12; h.sx = h.ox; h.sy = h.oy; h.sang = h.ang; }
  } else if (h.phase === 'ret') {
    h.pt -= dt; const e = Math.max(0, h.pt / 0.12) ** 2;
    h.ox = h.sx * e; h.oy = h.sy * e; h.ang = h.sang * e;
    if (h.pt <= 0) {
      h.phase = 'rest'; h.ox = h.oy = h.ang = 0; h.vx = h.vy = 0; h.av = (Math.random() < 0.5 ? -1 : 1) * 5; h.vy = 120;
      for (let n = 0; n < 8; n++) { const a = Math.random() * 6.283; poofs.push({ x: h.x + Math.cos(a) * 80, y: h.y + Math.sin(a) * 80, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, r: rnd(10, 20), t: 0.35 }); }
      SFX.pop();
    }
  } else {
    h.vx += (-260 * h.ox - 11 * h.vx) * dt; h.vy += (-260 * h.oy - 11 * h.vy) * dt;
    h.ox += h.vx * dt; h.oy += h.vy * dt;
    h.av += (-170 * h.ang - 7 * h.av) * dt; h.ang += h.av * dt;
  }
}

function update(dt) {
  time += dt; stateT += dt;
  for (const h of heads) updateHead(h, dt);
  if (state === 'show') updateShow(dt);
  else if (state === 'good' && stateT > 0.85) nextLevel();
  else if (state === 'oops' && stateT > 1.5) beginShow(0.2);
  else if (state === 'title' && Math.random() < dt * 0.9) { const i = Math.floor(Math.random() * 4); heads[i].lit = 0.45; }

  for (const d of drops) {
    d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.vy > 0 && d.y >= d.land) { stamp(d.x, d.y, d.r, d.vx, d.vy); d.dead = true; }
    if (d.x < -50 || d.x > W + 50 || d.y > H + 50) d.dead = true;
  }
  drops = drops.filter(d => !d.dead);
  for (const c of chunks) {
    c.life -= dt;
    if (c.y < c.land || c.vy < 0) { c.vy += 1500 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; }
    else { c.y = c.land; if (Math.abs(c.vy) > 120) { c.vy *= -0.35; c.vx *= 0.6; c.y -= 1; } else { c.vy = 0; c.vx *= 0.9; c.vr *= 0.9; c.x += c.vx * dt; } }
  }
  chunks = chunks.filter(c => c.life > 0);
  for (const p of poofs) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += 30 * dt; p.t -= dt; }
  poofs = poofs.filter(p => p.t > 0);
  for (const s of screenSplats) s.t -= dt;
  screenSplats = screenSplats.filter(s => s.t > 0);
  for (const b of bursts) b.t -= dt;
  bursts = bursts.filter(b => b.t > 0);
  for (const f of floaters) { f.t -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.t > 0);
  if (arm) { arm.t += dt; if (arm.t > 0.22) arm = null; }
  shake = Math.max(0, shake - dt * 40);
  redFlash = Math.max(0, redFlash - dt);
  bannerT = Math.max(0, bannerT - dt);

  ctx.strokeStyle = '#e6f2d8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.stroke();
  ctx.restore();
}
function drawGlove(gx, gy, a, s) {
  ctx.save(); ctx.translate(gx, gy); ctx.rotate(a); ctx.scale(s, s);
  const g = ctx.createRadialGradient(-4, -6, 2, 0, 0, 24); g.addColorStop(0, '#ff6b6b'); g.addColorStop(1, '#8e0f16');
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-26, -12, 10, 24);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 22, 20, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-2, -16, 10, 7, -0.4, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#5a070c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 22, 20, 0, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(2, 0, 14, -1.2, -0.2); ctx.stroke();
  ctx.restore();
}
function drawArms() {
  for (const side of [-1, 1]) {
    const sx = CX + side * 30, sy = CY + 40;
    const rx = CX + side * 66, ry = CY + 38 + Math.sin(time * 4 + side) * 3;
    let gx = rx, gy = ry;
    const active = arm && ((heads[arm.i].x < CX ? -1 : 1) === side);
    if (active) {
      const ext = arm.t < 0.05 ? arm.t / 0.05 : Math.max(0, 1 - (arm.t - 0.05) / 0.17);
      gx = rx + (arm.tx - rx) * ext; gy = ry + (arm.ty + 30 - ry) * ext;
    }
    ctx.strokeStyle = '#2b2f3a'; ctx.lineWidth = 26; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(gx, gy); ctx.stroke();
    const a = active ? Math.atan2(gy - sy, gx - sx) : (side < 0 ? Math.PI + 0.6 : -0.6);
    drawGlove(gx, gy, a, active ? 1.7 : 1.25);
  }
}

function drawBurst(b) {
  const k = b.t / 0.28, s = 1.35 + (1 - k) * 0.5;
  ctx.save(); ctx.translate(b.x, b.y - 10); ctx.rotate(b.rot); ctx.scale(s, s); ctx.globalAlpha = Math.min(1, k * 2.5);
  ctx.beginPath();
  for (let n = 0; n < 24; n++) { const a = n / 24 * 6.283, r = n % 2 ? 40 : 66; ctx.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 0.85); }
  ctx.closePath(); ctx.fillStyle = '#fff4b0'; ctx.fill(); ctx.strokeStyle = '#1a0a05'; ctx.lineWidth = 4; ctx.stroke();
  text(b.word, 0, 2, 30, '#c0121c', 'center', SPOOKY, false);
  ctx.restore(); ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const sx = shake ? rnd(-shake, shake) * 0.5 : 0, sy = shake ? rnd(-shake, shake) * 0.5 : 0;
  ctx.translate(sx, sy);
  ctx.drawImage(bg, 0, 0, W, H);

  for (const h of heads) drawTile(h, sx, sy);
  ctx.drawImage(decal, 0, 0, W, H);
  for (const h of heads) drawNeck(h);
  for (const h of heads) if (h.phase === 'rest') drawHead(h);
  drawHub(); drawFighter();
  for (const h of heads) if (h.phase !== 'rest') drawHead(h);
  lighter(() => { for (const h of heads) if (h.glow > 0.01) { glowAt(h.x, h.y, ZCOL[h.i], 400, h.glow * 0.42); glowAt(h.x, h.y, '#ffffff', 160, h.glow * 0.12); } });

  for (const p of poofs) { ctx.fillStyle = `rgba(200,200,190,${p.t * 1.5})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
  for (const c of chunks) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = Math.min(1, c.life * 2);
    if (c.type === 'tooth') { ctx.fillStyle = '#e3d48e'; ctx.fillRect(-4, -5, 8, 10); ctx.fillStyle = '#8a0c12'; ctx.fillRect(-4, 3, 8, 2); }
    else { ctx.fillStyle = '#f3efcd'; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 6.283); ctx.fill(); ctx.fillStyle = '#2a6a2a'; ctx.beginPath(); ctx.arc(3, 0, 3.2, 0, 6.283); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(3.5, 0, 1.5, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#8a0c12'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-14, 3); ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  for (const d of drops) { ctx.fillStyle = '#9a0b14'; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * (1 + Math.min(1.5, Math.abs(d.vy) / 600)), Math.atan2(d.vy, d.vx) - 1.57, 0, 6.283); ctx.fill(); }
  for (const b of bursts) drawBurst(b);
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.t * 2); text(f.text, f.x, f.y, 30, f.col); ctx.globalAlpha = 1; }

  drawArms();

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  for (const s of screenSplats) {
    const a = Math.min(0.8, s.t * 1.2), age = 1.3 - s.t;
    ctx.fillStyle = `rgba(120,6,12,${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    for (const b of s.blobs) { ctx.beginPath(); ctx.arc(s.x + Math.cos(b.a) * b.d, s.y + Math.sin(b.a) * b.d, b.r, 0, 6.283); ctx.fill(); }
    for (const d of s.drips) { const len = d.sp * age; ctx.fillRect(s.x + d.x - d.w / 2, s.y, d.w, len); ctx.beginPath(); ctx.arc(s.x + d.x, s.y + len, d.w * 0.7, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = `rgba(255,200,200,${a * 0.25})`; ctx.beginPath(); ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.25, 0, 6.283); ctx.fill();
  }
  if (redFlash > 0) { ctx.fillStyle = `rgba(200,0,20,${redFlash * 0.4})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
}

function drawBrain(x, y, s, on) {
  ctx.fillStyle = on ? '#f29bb2' : 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.ellipse(x - 5 * s, y, 8 * s, 7 * s, 0, 0, 6.283); ctx.ellipse(x + 5 * s, y, 8 * s, 7 * s, 0, 0, 6.283); ctx.fill();
  if (on) { ctx.strokeStyle = '#b4566e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y - 6 * s); ctx.lineTo(x, y + 6 * s); ctx.moveTo(x - 9 * s, y - 2); ctx.quadraticCurveTo(x - 5 * s, y + 3, x - 2, y - 2); ctx.moveTo(x + 9 * s, y - 2); ctx.quadraticCurveTo(x + 5 * s, y + 3, x + 2, y - 2); ctx.stroke(); }
}

function drawHUD() {
  if (state === 'title') return;
  for (let k = 0; k < 3; k++) drawBrain(30 + k * 32, 25, 1.15, k < lives);
  text('LV ' + level + '   ' + score.toLocaleString(), W - 18, 25, 24, '#b8f28a', 'right');
  let status = 'ZOMBIE SMACK SAYS', col = '#9aa88a';
  if (state === 'show') { status = 'WATCH & LISTEN...'; col = '#facc15'; }
  else if (state === 'input') { status = 'YOUR TURN — PUNCH ' + (idx + 1) + ' OF ' + seq.length; col = '#4ade80'; }
  else if (state === 'good') { status = 'BRAINS!'; col = '#4ade80'; }
  else if (state === 'oops') { status = 'WRONG HEAD! WATCH AGAIN'; col = '#f87171'; }
  if (statusFlash > 0 && state === 'show') { status = 'WAIT FOR IT...'; col = '#f87171'; }
  text(status, CX, 25, 28, col);
  if (state === 'input' || state === 'good') {
    const n = seq.length, w = Math.min(20, 520 / n), x0 = CX - (n - 1) * w / 2;
    for (let k = 0; k < n; k++) {
      ctx.beginPath(); ctx.arc(x0 + k * w, 629, Math.min(6, w * 0.32), 0, 6.283);
      if (k < idx) { ctx.fillStyle = ZCOL[seq[k]]; ctx.fill(); } else { ctx.strokeStyle = 'rgba(230,242,216,0.45)'; ctx.lineWidth = 2; ctx.stroke(); }
    }
  }
  if (bannerT > 0 && state === 'show') { ctx.globalAlpha = Math.min(1, bannerT * 2); text(bannerText, CX, CY - HUB - 34, 54, '#b8f28a'); ctx.globalAlpha = 1; }
}

function drawTitle() {
  ctx.fillStyle = 'rgba(4,6,10,0.72)'; ctx.fillRect(0, 0, W, H);
  const wob = Math.sin(time * 2) * 3;
  text('ZOMBIE', W / 2, 92 + wob, 86, '#8fd16a');
  text('SMACK SAYS', W / 2, 168 - wob, 70, '#d8363f');
  text('The zombies groan a pattern. Punch them back in the same order.', W / 2, 232, 18, '#e6f2d8', 'center', PLAIN);
  text('Click or tap a head   •   Keys 1 2 3 4  (or Q W A S)   •   M = sound', W / 2, 262, 15, '#b7c4a8', 'center', PLAIN);
  text('Miss the pattern and you lose a brain. Lose all 3 and it\'s game over.', W / 2, 288, 15, '#b7c4a8', 'center', PLAIN);
  text('They start out human. Every round you beat them up more. Add photos below to use real faces.', W / 2, 314, 15, '#8fd16a', 'center', PLAIN);
  if (Math.floor(time * 2) % 2 === 0) text('CLICK, TAP OR PRESS ENTER TO START', W / 2, 400, 30, '#facc15');
  if (best) text('BEST: LEVEL ' + best, W / 2, 436, 20, '#9aa88a');
}

function drawOver() {
  ctx.fillStyle = 'rgba(30,0,4,0.62)'; ctx.fillRect(0, 0, W, H);
  text('YOUR BRAINS', W / 2, 150, 70, '#f29bb2');
  text('GOT EATEN', W / 2, 225, 70, '#d8363f');
  text('You reached level ' + level + '  •  Score ' + score.toLocaleString(), W / 2, 290, 22, '#e6f2d8', 'center', PLAIN);
  if (newBest && Math.floor(time * 4) % 2) text('NEW BEST!', W / 2, 335, 36, '#facc15');
  if (stateT > 1.2) text('CLICK, TAP OR PRESS ENTER TO PLAY AGAIN', W / 2, 400, 26, '#b8f28a');
}

// ================= LOOP =================
let last = performance.now(), shown = null;
function loop(now) {
  const dt = clamp((now - last) / 1000, 0, 0.033); last = now;
  if (!(window.__apHold && window.__apHold())) update(dt);
  try { draw(); } catch (err) { console.error(err); }
  const showUI = state === 'title' || state === 'over';
  if (showUI !== shown) { shown = showUI; $('ui').style.display = showUI ? 'flex' : 'none'; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<script>
// ===== Angeles Productions house front-end (added by Pip; game code untouched apart from __apHold hooks) =====
(function () {
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };
  var intro = $('apIntro'), chooser = $('apChooser'), pauseOv = $('apPause'), pauseBtn = $('apPauseBtn');
  var mode = null, paused = false;

  function anyOverlay() { return intro.classList.contains('on') || chooser.classList.contains('on') || pauseOv.classList.contains('on'); }
  window.__apHold = function () { return anyOverlay(); };

  function applyMode(m) {
    mode = m;
    document.body.classList.toggle('ap-phone', m === 'mobile');
    $('apModeBtn').innerHTML = (m === 'mobile') ? '🖥️ COMPUTER MODE' : '📱 PHONE MODE';
  }
  function choose(m) {
    applyMode(m); store.set('zsmash-mode', m);
    intro.classList.remove('on'); chooser.classList.remove('on');
  }

  var q = new URLSearchParams(location.search).get('mode');
  var preset = (q === 'pc' || q === 'computer') ? 'pc' : (q === 'mobile' || q === 'phone') ? 'mobile' : store.get('zsmash-mode');
  if (preset === 'pc' || preset === 'mobile') { applyMode(preset); }
  else {
    intro.classList.add('on');
    var advanced = false;
    var advance = function () { if (advanced) return; advanced = true; intro.classList.remove('on'); chooser.classList.add('on'); };
    intro.addEventListener('click', advance);
    setTimeout(advance, 2100);
  }
  $('apPcBtn').addEventListener('click', function () { choose('pc'); });
  $('apPhoneBtn').addEventListener('click', function () { choose('mobile'); });

  function setPaused(p) {
    paused = p;
    pauseOv.classList.toggle('on', p);
    if (p) { try { speechSynthesis.cancel(); } catch (e) {} }
  }
  pauseBtn.addEventListener('click', function () { setPaused(true); });
  $('apResumeBtn').addEventListener('click', function () { setPaused(false); });
  $('apRestartBtn').addEventListener('click', function () { setPaused(false); try { startGame(); } catch (e) {} });
  $('apModeBtn').addEventListener('click', function () { choose(mode === 'mobile' ? 'pc' : 'mobile'); setPaused(true); });
  addEventListener('keydown', function (e) {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (pauseOv.classList.contains('on')) setPaused(false);
      else if (!anyOverlay() && typeof state !== 'undefined' && state !== 'title' && state !== 'over') setPaused(true);
    }
  });
  setInterval(function () {
    var playing = false;
    try { playing = (typeof state !== 'undefined') && state !== 'title' && state !== 'over'; } catch (e) {}
    pauseBtn.style.display = (playing && !anyOverlay()) ? 'block' : 'none';
  }, 200);
})();
</script>

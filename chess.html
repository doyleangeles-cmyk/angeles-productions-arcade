<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Chess</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #10131a radial-gradient(900px 500px at 50% -10%, rgba(255,210,63,.14), transparent 60%);
        color: #eef2ff; font-family: ui-sans-system, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .checker { height: 14px; background: repeating-conic-gradient(#e8ecf3 0% 25%, #14161c 0% 50%) 0 0/28px 28px; opacity:.9; }
      .screen { min-height: 100dvh; display: flex; flex-direction: column; }
      .hidden { display: none !important; }

      /* ---------- title screen ---------- */
      #screenTitle { align-items: center; justify-content: center; text-align: center; padding: 28px 18px 40px; }
      .brand { font-size: 13px; letter-spacing: .34em; text-transform: uppercase; color: #ffd23f; margin: 26px 0 10px; }
      h1.title {
        font-family: Georgia, "Times New Roman", serif; font-weight: 900;
        font-size: clamp(64px, 17vw, 148px); line-height: .95; margin: 0; letter-spacing: .04em;
        color: #f5f7ff; text-shadow: 0 4px 0 #000, 0 10px 34px rgba(0,0,0,.6);
      }
      h1.title .gold { color: #ffd23f; }
      .glyphrow { font-size: clamp(22px, 6vw, 34px); letter-spacing: .35em; margin: 18px 0 6px; color: #cdd7ea; text-indent: .35em; }
      .tagline { color: #9db4cc; font-size: clamp(15px, 3.6vw, 19px); margin: 8px 0 30px; }
      .bigbtn {
        font: inherit; font-size: 20px; font-weight: 800; letter-spacing: .08em; cursor: pointer;
        background: #ffd23f; color: #171106; border: 0; border-radius: 12px; padding: 16px 44px;
        box-shadow: 0 10px 26px rgba(0,0,0,.5);
      }
      .bigbtn:hover { filter: brightness(1.08); }
      .fineprint { margin-top: 26px; color: #66788f; font-size: 13px; }

      /* ---------- choice screen ---------- */
      #screenChoice { align-items: center; padding: 30px 16px 44px; }
      #screenChoice h2 { font-family: Georgia, serif; font-size: clamp(30px, 7vw, 46px); margin: 14px 0 4px; letter-spacing: .03em; }
      #screenChoice .sub { color: #9db4cc; margin: 0 0 26px; font-size: 16px; }
      .cards { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 1020px; width: 100%; }
      .setcard {
        flex: 1 1 280px; max-width: 330px; text-align: left; cursor: pointer; font: inherit; color: #eef2ff;
        background: #171d29; border: 2px solid #2c3a52; border-radius: 16px; padding: 22px 22px 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,.45);
      }
      .setcard:hover { border-color: #ffd23f; transform: translateY(-2px); }
      .setcard .glyphs { font-size: 34px; letter-spacing: .12em; }
      .setcard h3 { margin: 12px 0 6px; font-size: 22px; letter-spacing: .04em; }
      .setcard p { margin: 0 0 14px; color: #9db4cc; font-size: 14.5px; line-height: 1.5; }
      .setcard .play { font-weight: 800; color: #ffd23f; letter-spacing: .06em; }
      .setcard.guard .glyphs { color: #7db3e8; }
      .setcard.wars .glyphs { color: #ffe27a; }
      .setcard.west .glyphs { color: #e8a56b; }
      .backlink { margin-top: 30px; background: none; border: 0; color: #9db4cc; font: inherit; font-size: 15px; cursor: pointer; text-decoration: underline; }

      /* ---------- game screen ---------- */
      #screenGame { height: 100dvh; }
      .topbar {
        flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 10px;
        background: #0b0e14; border-bottom: 1px solid #2c3a52;
      }
      .topbar .setname { flex: 1; text-align: center; font-weight: 800; letter-spacing: .1em; font-size: 14px; color: #ffd23f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tbtn {
        font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; color: #eef2ff;
        background: rgba(255,255,255,.07); border: 1px solid #ffd23f; border-radius: 9px; padding: 8px 13px; white-space: nowrap;
      }
      .tbtn:hover { background: rgba(255,255,255,.16); }
      #gameFrame { flex: 1; width: 100%; border: 0; background: #0b0e14; }
    </style>
  </head>
  <body>
    <!-- ================= TITLE ================= -->
    <section class="screen" id="screenTitle">
      <div class="checker" style="width:min(520px,86vw)"></div>
      <div class="brand">Angeles Productions</div>
      <h1 class="title">CHE<span class="gold">SS</span></h1>
      <div class="glyphrow" aria-hidden="true">♟ ♞ ♝ ♜ ♛ ♚</div>
      <p class="tagline">Real chess, fought piece to piece — three battle sets on one board.</p>
      <button class="bigbtn" id="enterBtn">ENTER</button>
      <p class="fineprint">Every set: full chess engine, five-step AI, capture duels on the square.</p>
    </section>

    <!-- ================= CHOICE ================= -->
    <section class="screen hidden" id="screenChoice">
      <div class="checker" style="width:min(520px,86vw)"></div>
      <h2>Choose your set</h2>
      <p class="sub">Same chess underneath — pick the fighters.</p>
      <div class="cards">
        <button class="setcard guard" data-set="guard">
          <div class="glyphs" aria-hidden="true">♟♞♝</div>
          <h3>GUARD CHESS</h3>
          <p>Day Shift guards vs the nursing staff. AVADE hands, pepper spray, syringes and one very determined Orderly with an IV pole.</p>
          <span class="play">PLAY &#9654;</span>
        </button>
        <button class="setcard wars" data-set="wars">
          <div class="glyphs" aria-hidden="true">♜♛♚</div>
          <h3>STAR WARS CHESS</h3>
          <p>The galactic set. The original battle chess — heroes, villains and droids fighting out every capture on the square.</p>
          <span class="play">PLAY &#9654;</span>
        </button>
        <button class="setcard west" data-set="west">
          <div class="glyphs" aria-hidden="true">♞♜♟</div>
          <h3>COWBOYS &amp; INDIANS CHESS</h3>
          <p>Old West showdown. Sheriff, Sharpshooter, Preacher and the town Water Tower against a Chief, a Medicine Woman and a carved Totem Pole.</p>
          <span class="play">PLAY &#9654;</span>
        </button>
      </div>
      <button class="backlink" id="toTitleBtn">&#8592; back to title</button>
    </section>

    <!-- ================= GAME ================= -->
    <section class="screen hidden" id="screenGame">
      <div class="topbar">
        <button class="tbtn" id="allSetsBtn">&#8249; ALL SETS</button>
        <div class="setname" id="setName">CHESS</div>
        <button class="tbtn" id="pauseBtn">&#9208; PAUSE</button>
      </div>
      <iframe id="gameFrame" title="Chess game" sandbox="allow-scripts allow-modals allow-downloads allow-same-origin"></iframe>
    </section>

      var NAMES = { guard: "GUARD CHESS", wars: "STAR WARS CHESS", west: "COWBOYS & INDIANS CHESS" };
      var titleEl = document.getElementById("screenTitle");
      var choiceEl = document.getElementById("screenChoice");
      var gameEl = document.getElementById("screenGame");
      var frame = document.getElementById("gameFrame");
      var setNameEl = document.getElementById("setName");
      var myMode = new URLSearchParams(location.search).get("mode") === "mobile" ? "mobile" : "pc";

      function show(el){ [titleEl, choiceEl, gameEl].forEach(function(x){ x.classList.toggle("hidden", x !== el); }); window.scrollTo(0, 0); }
      function decode(b64){
        var bin = atob(b64), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder("utf-8").decode(bytes);
      }
      function launch(key){
        setNameEl.textContent = NAMES[key] || "CHESS";
        frame.srcdoc = decode(GAMES[key]);
        show(gameEl);
      }
      function backToChoice(){ frame.srcdoc = ""; show(choiceEl); }

      document.getElementById("enterBtn").addEventListener("click", function(){ show(choiceEl); });
      document.getElementById("toTitleBtn").addEventListener("click", function(){ show(titleEl); });
      document.getElementById("allSetsBtn").addEventListener("click", backToChoice);
      document.querySelectorAll(".setcard").forEach(function(card){
        card.addEventListener("click", function(){ launch(card.getAttribute("data-set")); });
      });
      document.getElementById("pauseBtn").addEventListener("click", function(){
        try {
          var btn = frame.contentDocument && frame.contentDocument.getElementById("apPauseBtn");
          if (btn) btn.click();
        } catch (e) {}
      });

      frame.addEventListener("load", function(){
        var doc;
        try { doc = frame.contentDocument; } catch (e) { return; }
        if (!doc) return;
        try { frame.contentWindow.__apMode = myMode; } catch (e) {}
        doc.addEventListener("click", function(e){
          var t = e.target && e.target.closest ? e.target.closest("#apTitle, #apArcade") : null;
          if (!t) return;
          e.preventDefault(); e.stopImmediatePropagation();
          if (t.id === "apTitle") backToChoice();
          else window.top.location.href = t.href;
        }, true);
      });
    </script>
